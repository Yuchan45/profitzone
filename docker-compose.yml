# Servicios de infraestructura para desarrollo local (bases de datos).
# La API y el front se corren con `npm run dev` fuera de Docker.
#
# Las variables salen de profit-zone-back/.env. Desde profit-zone-back/:
#   npm run db:up      levanta SQL Server y espera a que esté healthy
#   npm run db:down    lo detiene (los datos quedan en el volumen)
#   npm run db:logs    muestra los logs

name: profitzone

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: profitzone-sqlserver
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Definí DB_PASSWORD en profit-zone-back/.env}
    ports:
      # Solo en 127.0.0.1: SQL Server (usuario sa) no queda expuesto a la red local.
      - '127.0.0.1:${DB_PORT:-1433}:1433'
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  mssql-data:
